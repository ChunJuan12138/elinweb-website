server {
    listen 80;
    server_name _;  # 替换为你的域名，例如 elinweb.com www.elinweb.com

    root /var/www/elinweb;
    index index.html;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端路由支持：所有路径都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁用 favicon 的 404 日志
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
